[project]
name = "unilib"
version = "0.1.0"
description = "Lecture-slide library with hybrid search and an MCP server"
requires-python = ">=3.12"
# The base install is the client (unilib-client, unilib-local-mcp): stdlib + mcp only.
# The search server needs the `server` extra (models, PDF tooling).
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
server = [
    "pymupdf>=1.26",
    "numpy>=2",
    "sentence-transformers>=5",   # Qwen3-Embedding (qwen.py, imported lazily)
    "transformers>=4.51",         # Qwen3-Reranker; 4.51 is the first with the qwen3 architecture
    "torch>=2.8",                 # CPU wheels via [tool.uv.sources]
]

[project.scripts]
unilib = "unilib.cli:main"
unilib-mcp = "unilib.server:main"
unilib-local-mcp = "unilib.local_server:main"
unilib-client = "unilib.client_cli:main"

[dependency-groups]
dev = ["pytest>=8", "unilib[server]"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unilib"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "slow: uses the real embedding model (downloads ~130 MB once)",
    "eval: golden-query evaluation against the real library",
]
addopts = "-m 'not eval'"
